<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | Basant Kumar</title>
  <link rel="icon" type="image/png" href="https://bk871709-sketch.github.io/my-portfolio/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>
    <p id="counter">0 tasks left</p>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Add a new task" autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="done">Done</button>
    </div>

    <ul id="task-list"></ul>

    <button id="clear-done">Clear completed</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
